name: Bug report
description: Something in FMini-1 doesn't work as it should (one bug per issue)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Issues are for reproducible bugs only. Suggestions, ideas or Questions go to [Discussions](https://github.com/ruppert/fmini-1/discussions).
  - type: input
    id: version
    attributes:
      label: Fmini-1 version
      description: The version appears during boot (or GLOBAL->Version).
      placeholder: "v0.0.0 - FM-1 or SMK-37?"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations:
      required: true
